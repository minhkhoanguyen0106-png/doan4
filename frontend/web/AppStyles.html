<style>
/* ==========================================================================
   APP STYLES: DẢI ÁNH SÁNG UỐN LƯỢN CHỮ S (S-CURVE RIBBON JOURNEY)
   PONDORA - SMART AQUACULTURE SYSTEM
   
   Hỗ trợ 2 chế độ phối màu:
   - Dark Mode:  Vàng Champagne (#F5E6C8 / #DFB76C) – Ngọc Lục Bảo (#10B981 / #00E5A3)
   - Light Mode: Vàng Hổ Phách (#D97706 / #B45309) – Xanh Rêu Cổ Kính (#4D7C0F / #65A30D)
   ========================================================================== */

:root {
  /* ========================================================================
     DARK MODE PALETTE (Mặc định - Đại dương huyền ảo & Công nghệ sâu thẳm)
     ======================================================================== */
  --s-bg-base: #060B14;
  --s-bg-surface: #0B1324;
  --s-bg-card: rgba(10, 18, 34, 0.82);
  --s-bg-card-hover: rgba(14, 25, 48, 0.94);
  --s-border-card: rgba(223, 183, 108, 0.28);
  --s-border-card-hover: rgba(223, 183, 108, 0.70);
  
  /* Vàng Champagne */
  --s-gold-champagne: #F5E6C8;
  --s-gold-accent: #DFB76C;
  --s-gold-dim: #997A44;
  --s-gold-glow: rgba(223, 183, 108, 0.6);
  
  /* Ngọc Lục Bảo */
  --s-emerald-gem: #10B981;
  --s-emerald-glow: #00E5A3;
  --s-emerald-deep: #064E3B;
  --s-emerald-shadow: rgba(0, 229, 163, 0.45);
  
  /* Cyan Đại dương điểm xuyến */
  --s-cyan-accent: #38BDF8;
  --s-cyan-glow: #00D2FF;

  /* Dải sáng đường ray (Ribbon Beam) */
  --s-beam-track: rgba(223, 183, 108, 0.12);
  --s-beam-gradient-start: #DFB76C;
  --s-beam-gradient-mid: #F5E6C8;
  --s-beam-gradient-end: #00E5A3;
  
  /* Hiệu ứng hào quang phát quang */
  --s-glow-shadow-gold: 0 0 24px rgba(223, 183, 108, 0.55), 0 0 48px rgba(223, 183, 108, 0.22);
  --s-glow-shadow-emerald: 0 0 24px rgba(0, 229, 163, 0.55), 0 0 48px rgba(0, 229, 163, 0.22);
  --s-orb-glow: drop-shadow(0 0 10px #DFB76C) drop-shadow(0 0 22px #00E5A3) drop-shadow(0 0 32px #00D2FF);
  
  /* Màu chữ & Thẻ thông tin */
  --s-text-primary: #F8FAFC;
  --s-text-secondary: #CBD5E1;
  --s-text-muted: #64748B;
  --s-badge-bg: rgba(223, 183, 108, 0.14);
  --s-pill-bg: rgba(255, 255, 255, 0.05);
  --s-pill-border: rgba(255, 255, 255, 0.10);

  /* Status Colors */
  --s-status-optimal: #10B981;
  --s-status-optimal-bg: rgba(16, 185, 129, 0.14);
  --s-status-warning: #F59E0B;
  --s-status-warning-bg: rgba(245, 158, 11, 0.14);
  --s-status-critical: #EF4444;
  --s-status-critical-bg: rgba(239, 68, 68, 0.14);
}

/* ==========================================================================
   LIGHT MODE OVERRIDES (Vàng Hổ Phách – Xanh Rêu Sang Trọng, Sáng Rõ)
   ========================================================================== */
[data-theme="light"],
.theme-light {
  --s-bg-base: #F8FAFC;
  --s-bg-surface: #EFF6FF;
  --s-bg-card: rgba(255, 255, 255, 0.94);
  --s-bg-card-hover: rgba(255, 255, 255, 0.99);
  --s-border-card: rgba(217, 119, 6, 0.26);
  --s-border-card-hover: rgba(77, 124, 15, 0.60);
  
  /* Vàng Hổ Phách */
  --s-gold-champagne: #D97706;
  --s-gold-accent: #B45309;
  --s-gold-dim: #78350F;
  --s-gold-glow: rgba(217, 119, 6, 0.45);
  
  /* Xanh Rêu Cổ Kính */
  --s-emerald-gem: #4D7C0F;
  --s-emerald-glow: #65A30D;
  --s-emerald-deep: #14532D;
  --s-emerald-shadow: rgba(77, 124, 15, 0.35);
  
  /* Cyan Đại dương điểm xuyến */
  --s-cyan-accent: #0284C7;
  --s-cyan-glow: #0369A1;

  /* Dải sáng đường ray (Ribbon Beam) */
  --s-beam-track: rgba(217, 119, 6, 0.18);
  --s-beam-gradient-start: #D97706;
  --s-beam-gradient-mid: #B45309;
  --s-beam-gradient-end: #4D7C0F;
  
  /* Hiệu ứng hào quang phát quang */
  --s-glow-shadow-gold: 0 0 20px rgba(217, 119, 6, 0.45), 0 0 38px rgba(217, 119, 6, 0.18);
  --s-glow-shadow-emerald: 0 0 20px rgba(77, 124, 15, 0.45), 0 0 38px rgba(77, 124, 15, 0.18);
  --s-orb-glow: drop-shadow(0 0 8px #D97706) drop-shadow(0 0 16px #4D7C0F);
  
  /* Màu chữ & Thẻ thông tin */
  --s-text-primary: #0F172A;
  --s-text-secondary: #334155;
  --s-text-muted: #64748B;
  --s-badge-bg: rgba(217, 119, 6, 0.12);
  --s-pill-bg: rgba(15, 23, 42, 0.04);
  --s-pill-border: rgba(15, 23, 42, 0.09);

  /* Status Colors */
  --s-status-optimal: #15803D;
  --s-status-optimal-bg: rgba(21, 128, 61, 0.12);
  --s-status-warning: #B45309;
  --s-status-warning-bg: rgba(180, 83, 9, 0.12);
  --s-status-critical: #DC2626;
  --s-status-critical-bg: rgba(220, 38, 38, 0.12);
}

/* Base Container & Typography */
.s-page-wrap {
  position: relative;
  width: 100%;
  min-height: 100vh;
  padding: 0 0 60px 0;
  font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
  overflow-x: hidden;
}

/* ==========================================================================
   HERO HEADER TRANG CHỦ (Theo dõi nước ao tôm tự động)
   ========================================================================== */
.s-hero-section {
  max-width: 1140px;
  margin: 40px auto 30px auto;
  text-align: center;
  padding: 0 24px;
}

.s-hero-badge {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 6px 18px;
  border-radius: 999px;
  background: var(--s-badge-bg);
  border: 1px solid var(--s-border-card);
  color: var(--s-gold-accent);
  font-size: 12px;
  font-weight: 800;
  letter-spacing: 1.2px;
  text-transform: uppercase;
  margin-bottom: 20px;
}

.s-hero-badge::before {
  content: '';
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--s-emerald-glow);
  box-shadow: 0 0 8px var(--s-emerald-glow);
}

.s-hero-title {
  font-size: clamp(28px, 4.4vw, 50px);
  font-weight: 900;
  line-height: 1.2;
  letter-spacing: -1px;
  color: var(--s-text-primary);
  margin-bottom: 18px;
}

.s-hero-desc {
  max-width: 820px;
  margin: 0 auto 30px auto;
  font-size: clamp(15px, 1.8vw, 17px);
  line-height: 1.68;
  color: var(--s-text-secondary);
}

.s-hero-actions {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 14px;
  flex-wrap: wrap;
  margin-bottom: 34px;
}

.s-btn-primary {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 13px 28px;
  border-radius: 14px;
  background: linear-gradient(135deg, #0284C7, #0369A1);
  color: #FFFFFF;
  font-size: 14px;
  font-weight: 800;
  text-decoration: none;
  border: none;
  cursor: pointer;
  box-shadow: 0 6px 20px rgba(2, 132, 199, 0.38);
  transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
}

.s-btn-primary:hover {
  transform: translateY(-2px);
  box-shadow: 0 10px 28px rgba(2, 132, 199, 0.55);
}

.s-btn-glass {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 12px 24px;
  border-radius: 14px;
  background: var(--s-pill-bg);
  border: 1px solid var(--s-border-card);
  color: var(--s-text-primary);
  font-size: 14px;
  font-weight: 700;
  text-decoration: none;
  cursor: pointer;
  backdrop-filter: blur(8px);
  transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
}

.s-btn-glass:hover {
  transform: translateY(-2px);
  background: var(--s-bg-card-hover);
  border-color: var(--s-gold-accent);
}

/* Video Showcase Banner */
.s-video-banner {
  max-width: 960px;
  margin: 0 auto 50px auto;
  padding: 24px 30px;
  border-radius: 24px;
  background: var(--s-bg-card);
  border: 1px solid var(--s-border-card);
  backdrop-filter: blur(16px);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
  flex-wrap: wrap;
  box-shadow: 0 12px 36px rgba(0, 0, 0, 0.25);
}

.s-video-banner-lead {
  text-align: left;
}

.s-video-banner-badge {
  font-size: 11px;
  font-weight: 800;
  color: var(--s-gold-accent);
  letter-spacing: 1.2px;
  text-transform: uppercase;
  margin-bottom: 6px;
}

.s-video-banner-title {
  font-size: 18px;
  font-weight: 800;
  color: var(--s-text-primary);
  margin-bottom: 4px;
}

.s-video-banner-desc {
  font-size: 13.5px;
  color: var(--s-text-secondary);
}

/* ==========================================================================
   TELEMETRY STRIP (Dải 6 chỉ số nước thực tế)
   ========================================================================== */
.s-telemetry-strip {
  max-width: 1140px;
  margin: 0 auto 70px auto;
  padding: 0 20px;
  display: grid;
  grid-template-columns: repeat(6, 1fr);
  gap: 12px;
}

.s-telemetry-card {
  padding: 14px 14px;
  border-radius: 16px;
  background: var(--s-bg-card);
  border: 1px solid var(--s-border-card);
  backdrop-filter: blur(10px);
  transition: all 0.25s ease;
  text-align: left;
}

.s-telemetry-card:hover {
  border-color: var(--s-gold-accent);
  transform: translateY(-2px);
}

.s-telemetry-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: 11.5px;
  font-weight: 700;
  color: var(--s-text-secondary);
  margin-bottom: 8px;
}

.s-telemetry-val {
  font-size: 22px;
  font-weight: 900;
  font-family: 'JetBrains Mono', monospace;
  color: var(--s-text-primary);
  margin-bottom: 4px;
}

.s-telemetry-val small {
  font-size: 11px;
  font-weight: 600;
  color: var(--s-text-muted);
}

.s-telemetry-badge {
  font-size: 10px;
  font-weight: 800;
  padding: 2px 6px;
  border-radius: 6px;
  background: var(--s-status-optimal-bg);
  color: var(--s-status-optimal);
}

.s-telemetry-sub {
  font-size: 10.5px;
  color: var(--s-text-muted);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* ==========================================================================
   RỦI RO THƯỜNG GẶP (Editorial Problem Section)
   ========================================================================== */
.s-problem-section {
  max-width: 1140px;
  margin: 0 auto 90px auto;
  padding: 0 24px;
  display: grid;
  grid-template-columns: 1.15fr 0.85fr;
  gap: 40px;
  align-items: center;
}

.s-problem-lead {
  display: flex;
  flex-direction: column;
  gap: 14px;
  text-align: left;
}

.s-problem-badge {
  font-size: 11px;
  font-weight: 800;
  color: #EF4444;
  letter-spacing: 1.4px;
  text-transform: uppercase;
}

.s-problem-title {
  font-size: clamp(24px, 3.2vw, 34px);
  font-weight: 900;
  letter-spacing: -0.6px;
  line-height: 1.28;
  color: var(--s-text-primary);
}

.s-problem-desc {
  font-size: 14.5px;
  line-height: 1.65;
  color: var(--s-text-secondary);
}

.s-problem-stat-box {
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 16px 22px;
  border-radius: 18px;
  background: rgba(239, 68, 68, 0.08);
  border: 1px solid rgba(239, 68, 68, 0.22);
}

.s-problem-stat-num {
  font-size: 32px;
  font-weight: 900;
  color: #EF4444;
  line-height: 1;
}

.s-problem-stat-text {
  font-size: 13px;
  font-weight: 600;
  line-height: 1.45;
  color: var(--s-text-secondary);
}

.s-danger-cards {
  display: flex;
  flex-direction: column;
  gap: 14px;
}

.s-danger-card {
  padding: 16px 20px;
  border-radius: 16px;
  background: var(--s-bg-card);
  border: 1px solid var(--s-border-card);
  border-left: 4px solid #EF4444;
  box-shadow: 0 8px 24px rgba(0, 0, 0, 0.15);
  text-align: left;
}

.s-danger-title {
  font-size: 12px;
  font-weight: 800;
  letter-spacing: 0.8px;
  text-transform: uppercase;
  color: #EF4444;
  margin-bottom: 5px;
  display: flex;
  align-items: center;
  gap: 6px;
}

.s-danger-desc {
  font-size: 13.5px;
  line-height: 1.55;
  color: var(--s-text-secondary);
}

/* ==========================================================================
   CONTAINER CHÍNH: .s-flow-journey
   Dải ánh sáng uốn lượn hình chữ S kết nối 4 cột mốc xen kẽ trái - phải
   ========================================================================== */
.s-flow-journey {
  position: relative;
  width: 100%;
  max-width: 1240px;
  margin: 0 auto 100px auto;
  padding: 80px 24px 100px 24px;
  box-sizing: border-box;
}

.s-journey-header {
  text-align: center;
  max-width: 780px;
  margin: 0 auto 80px auto;
  position: relative;
  z-index: 2;
}

.s-journey-eyebrow {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  font-size: 12px;
  font-weight: 800;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: var(--s-gold-accent);
  background: var(--s-badge-bg);
  padding: 6px 18px;
  border-radius: 999px;
  border: 1px solid var(--s-border-card);
  margin-bottom: 16px;
}

.s-journey-title {
  font-size: clamp(28px, 4.2vw, 42px);
  font-weight: 900;
  letter-spacing: -0.8px;
  line-height: 1.25;
  color: var(--s-text-primary);
  margin-bottom: 16px;
}

.s-journey-desc {
  font-size: clamp(15px, 1.8vw, 17px);
  line-height: 1.68;
  color: var(--s-text-secondary);
  margin: 0;
}

/* ==========================================================================
   SVG CANVAS & DẢI ÁNH SÁNG CHỮ S (#sRibbonCanvas)
   ========================================================================== */
.s-ribbon-canvas {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  z-index: 1;
  overflow: visible;
}

#sRibbonBase {
  fill: none;
  stroke: var(--s-beam-track);
  stroke-width: 3.5px;
  stroke-linecap: round;
  stroke-linejoin: round;
  opacity: 0.85;
}

#sRibbonBeam {
  fill: none;
  stroke: url(#sBeamGrad);
  stroke-width: 5px;
  stroke-linecap: round;
  stroke-linejoin: round;
  transition: stroke-dashoffset 0.08s cubic-bezier(0.16, 1, 0.3, 1);
}

#sRibbonOrb {
  fill: #FFFFFF;
  stroke: var(--s-gold-champagne);
  stroke-width: 3px;
  filter: var(--s-orb-glow);
  transition: transform 0.08s cubic-bezier(0.16, 1, 0.3, 1);
  will-change: transform, cx, cy;
}

/* ==========================================================================
   DANH SÁCH 4 BƯỚC CỘT MỐC (.s-step-row) XEN KẼ TRÁI - PHẢI
   ========================================================================== */
.s-journey-timeline {
  position: relative;
  z-index: 2;
  display: flex;
  flex-direction: column;
  gap: 120px;
}

.s-step-row {
  position: relative;
  display: grid;
  grid-template-columns: 1fr 1fr;
  align-items: center;
  min-height: 380px;
}

.s-step-row.is-left .s-card-wrap {
  grid-column: 1;
  padding-right: 60px;
  text-align: left;
}

.s-step-row.is-right .s-card-wrap {
  grid-column: 2;
  padding-left: 60px;
  text-align: left;
}

/* Nút mốc tròn số (.s-milestone-node) */
.s-milestone-node {
  position: absolute;
  top: 50%;
  transform: translate(-50%, -50%);
  width: 58px;
  height: 58px;
  border-radius: 50%;
  background: var(--s-bg-surface);
  border: 2px solid var(--s-border-card);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  z-index: 3;
  box-shadow: 0 6px 20px rgba(0, 0, 0, 0.45);
  transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
  cursor: pointer;
}

.s-step-row.is-left .s-milestone-node {
  left: 50%;
}
.s-step-row.is-right .s-milestone-node {
  left: 50%;
}

.s-node-number {
  font-family: 'JetBrains Mono', monospace;
  font-size: 13.5px;
  font-weight: 800;
  color: var(--s-gold-accent);
  line-height: 1;
  transition: color 0.3s ease;
}

.s-node-dot {
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: var(--s-gold-dim);
  margin-top: 4px;
  transition: all 0.3s ease;
}

/* TRẠNG THÁI: ĐANG KÍCH HOẠT (.is-active) */
.s-milestone-node.is-active {
  border-color: var(--s-gold-champagne);
  box-shadow: var(--s-glow-shadow-gold);
  transform: translate(-50%, -50%) scale(1.18);
  background: radial-gradient(circle, #251D10 0%, var(--s-bg-surface) 100%);
}

.s-milestone-node.is-active .s-node-number {
  color: #FFFFFF;
  text-shadow: 0 0 10px var(--s-gold-accent);
}

.s-milestone-node.is-active .s-node-dot {
  background: var(--s-emerald-glow);
  box-shadow: 0 0 8px var(--s-emerald-glow);
  transform: scale(1.4);
}

/* TRẠNG THÁI: ĐÃ ĐI QUA (.is-passed) */
.s-milestone-node.is-passed {
  border-color: var(--s-emerald-glow);
  box-shadow: var(--s-glow-shadow-emerald);
  background: radial-gradient(circle, #08281E 0%, var(--s-bg-surface) 100%);
}

.s-milestone-node.is-passed .s-node-number {
  color: var(--s-emerald-glow);
}

.s-milestone-node.is-passed .s-node-dot {
  background: var(--s-emerald-gem);
}

/* ==========================================================================
   KHỐI NỘI DUNG 4 KHU VỰC (.s-card-content)
   ========================================================================== */
.s-card-content {
  position: relative;
  padding: 34px 38px;
  border-radius: 26px;
  background: var(--s-bg-card);
  border: 1px solid var(--s-border-card);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  box-shadow: 0 16px 40px rgba(0, 0, 0, 0.28);
  transition: transform 0.45s cubic-bezier(0.16, 1, 0.3, 1),
              box-shadow 0.45s cubic-bezier(0.16, 1, 0.3, 1),
              border-color 0.3s ease,
              opacity 0.6s ease;
  opacity: 0.92;
  transform: translateY(0);
}

.s-card-content.is-visible {
  opacity: 1;
}

.s-card-content:hover {
  transform: translateY(-4px);
  border-color: var(--s-border-card-hover);
  box-shadow: 0 22px 50px rgba(0, 0, 0, 0.36), 0 0 24px rgba(223, 183, 108, 0.18);
}

.s-card-badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 5px 14px;
  border-radius: 8px;
  background: var(--s-badge-bg);
  border: 1px solid var(--s-border-card);
  font-size: 11px;
  font-weight: 800;
  letter-spacing: 1px;
  color: var(--s-gold-accent);
  text-transform: uppercase;
  margin-bottom: 14px;
}

.s-card-title {
  font-size: clamp(20px, 2.2vw, 25px);
  font-weight: 900;
  letter-spacing: -0.4px;
  margin: 0 0 14px 0;
  color: var(--s-text-primary);
  display: flex;
  align-items: center;
  gap: 10px;
}

.s-card-text {
  font-size: 14.5px;
  line-height: 1.68;
  color: var(--s-text-secondary);
  margin: 0 0 18px 0;
}

.s-card-highlight {
  padding: 12px 16px;
  border-radius: 12px;
  background: rgba(223, 183, 108, 0.08);
  border-left: 3px solid var(--s-gold-accent);
  font-size: 13.5px;
  font-weight: 600;
  color: var(--s-gold-champagne);
  margin-bottom: 20px;
  line-height: 1.5;
}

[data-theme="light"] .s-card-highlight {
  color: var(--s-gold-dim);
  background: rgba(217, 119, 6, 0.08);
}

/* Bullet Points */
.s-features-list {
  display: flex;
  flex-direction: column;
  gap: 10px;
  margin-bottom: 22px;
}

.s-feature-item {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  font-size: 13.5px;
  line-height: 1.55;
  color: var(--s-text-secondary);
}

.s-feature-bullet {
