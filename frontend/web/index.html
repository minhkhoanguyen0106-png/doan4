<html>
<head>

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Pondora - Hệ thống IoT giám sát chất lượng nước và nhật ký ao tôm thông minh.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Pondora">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Pondora - Giám Sát & Nhật Ký Ao Tôm</title>
  <link rel="manifest" href="manifest.json">

  <!-- PONDORA Early Warning System Web Audio Synthesizer -->
  <script>
    let _pondoraCtx = null;
    function getAudioCtx() {
      if (!_pondoraCtx) {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (AudioCtx) _pondoraCtx = new AudioCtx();
      }
      if (_pondoraCtx && _pondoraCtx.state === 'suspended') {
        _pondoraCtx.resume();
      }
      return _pondoraCtx;
    }

    // Auto unlock AudioContext on any user interaction with the browser
    ['click', 'touchstart', 'pointerdown', 'keydown'].forEach(evt => {
      document.addEventListener(evt, function() {
        const c = getAudioCtx();
        if (c && c.state === 'suspended') c.resume();
      }, { passive: true });
    });

    window.playPondoraAlarm = function(severity) {
      try {
        const ctx = getAudioCtx();
        if (!ctx) return;

        const playTone = () => {
          const now = ctx.currentTime;
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.connect(gain);
          gain.connect(ctx.destination);

          if (severity === 'CRITICAL') {
            // Urgent 3-pulse Siren Alert for CRITICAL
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(880, now);
            osc.frequency.linearRampToValueAtTime(587, now + 0.2);
            osc.frequency.linearRampToValueAtTime(920, now + 0.4);
            osc.frequency.linearRampToValueAtTime(587, now + 0.6);
            gain.gain.setValueAtTime(0.5, now);
            gain.gain.linearRampToValueAtTime(0.01, now + 0.75);
            osc.start(now);
            osc.stop(now + 0.75);
          } else {
            // Dual harmonic alert beep for HIGH / WARNING
            osc.type = 'sine';
            osc.frequency.setValueAtTime(800, now);
            osc.frequency.setValueAtTime(1050, now + 0.15);
            gain.gain.setValueAtTime(0.4, now);
            gain.gain.linearRampToValueAtTime(0.01, now + 0.45);
            osc.start(now);
            osc.stop(now + 0.45);
          }
        };

        if (ctx.state === 'suspended') {
          ctx.resume().then(playTone).catch(() => {});
        } else {
          playTone();
        }
      } catch (e) {
        console.warn('AudioContext playback error:', e);
      }
    };
  </script>
</head>
<body>

</body>
</html>
