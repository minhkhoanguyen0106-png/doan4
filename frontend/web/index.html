  <!-- PONDORA Early Warning System Web Audio Synthesizer -->
  <script>
    let _pondoraCtx = null;
    function getAudioCtx() {
      if (!_pondoraCtx) {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (AudioCtx) _pondoraCtx = new AudioCtx();
      }
      if (_pondoraCtx && _pondoraCtx.state === 'suspended') {
        _pondoraCtx.resume();
      }
      return _pondoraCtx;
    }

    // Auto unlock AudioContext on any user interaction with the browser
    ['click', 'touchstart', 'pointerdown', 'keydown'].forEach(evt => {
      document.addEventListener(evt, function() {
        const c = getAudioCtx();
        if (c && c.state === 'suspended') c.resume();
      }, { passive: true });
    });

    window.playPondoraAlarm = function(severity) {
      try {
        const ctx = getAudioCtx();
        if (!ctx) return;

        const playTone = () => {
          const now = ctx.currentTime;
          const totalDuration = 2.2;

          // Master Gain
          const masterGain = ctx.createGain();
          masterGain.connect(ctx.destination);
          masterGain.gain.setValueAtTime(0.6, now);

          // Oscillator 1: Main piercing siren (sawtooth)
          const osc1 = ctx.createOscillator();
          osc1.type = 'sawtooth';
          osc1.connect(masterGain);

          // Oscillator 2: Sub-octave alarm (square) for industrial acoustic punch
          const osc2 = ctx.createOscillator();
          osc2.type = 'square';
          const subGain = ctx.createGain();
          subGain.gain.setValueAtTime(0.35, now);
          osc2.connect(subGain);
          subGain.connect(masterGain);

          // Rapid 5-cycle Emergency Siren: sweeps between 650Hz and 1150Hz
          const cycles = 5;
          const halfCycle = totalDuration / (cycles * 2);

          osc1.frequency.setValueAtTime(650, now);
          osc2.frequency.setValueAtTime(325, now);

          for (let i = 0; i < cycles * 2; i++) {
            const t = now + (i + 1) * halfCycle;
            const targetFreq1 = (i % 2 === 0) ? 1150 : 650;
            const targetFreq2 = (i % 2 === 0) ? 575 : 325;
            osc1.frequency.exponentialRampToValueAtTime(targetFreq1, t);
            osc2.frequency.exponentialRampToValueAtTime(targetFreq2, t);
          }

          // Smooth fade-out at the end
          masterGain.gain.setValueAtTime(0.6, now + totalDuration - 0.15);
          masterGain.gain.linearRampToValueAtTime(0.001, now + totalDuration);

          osc1.start(now);
          osc2.start(now);
          osc1.stop(now + totalDuration);
          osc2.stop(now + totalDuration);
        };

        if (ctx.state === 'suspended') {
          ctx.resume().then(playTone).catch(() => {});
        } else {
          playTone();
        }
      } catch (e) {
        console.warn('AudioContext playback error:', e);
      }
    };
  </script>
