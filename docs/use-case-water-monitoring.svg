<svg xmlns="http://www.w3.org/2000/svg" width="1750" height="1060" viewBox="0 0 1750 1060" role="img" aria-labelledby="title desc">
  <title id="title">Water Quality Monitoring System Use Case Diagram</title>
  <desc id="desc">Use case diagram for a water quality monitoring application with a user, an administrator, and an ESP32 sensor device.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 z" fill="#697586"/></marker>
    <style>
      text{font-family:Arial,Helvetica,sans-serif;fill:#172033}.title{font-size:27px;font-weight:700}.actorLabel{font-size:16px;font-weight:600}.case{fill:#fff;stroke:#35445d;stroke-width:1.7}.group{fill:#f3f7fc;stroke:#35445d;stroke-width:1.8}.caseText{font-size:15px;text-anchor:middle;dominant-baseline:middle}.link{fill:none;stroke:#66758a;stroke-width:1.5}.include{fill:none;stroke:#66758a;stroke-width:1.4;stroke-dasharray:6 5;marker-end:url(#arrow)}.rel{font-size:12px;fill:#4b5563;font-style:italic}.boundary{fill:#fbfcfe;stroke:#cbd5e1;stroke-width:1.5;rx:18}
    </style>
  </defs>
  <rect width="1500" height="1060" fill="#fff"/>
  <text x="750" y="48" text-anchor="middle" class="title">WATER QUALITY MONITORING SYSTEM — USE CASE DIAGRAM</text>
  <rect x="220" y="78" width="1350" height="925" class="boundary"/>
  <text x="837" y="105" text-anchor="middle" font-size="16" font-weight="700" fill="#475569">Water Quality Monitoring System</text>

  <!-- Actors -->
  <g stroke="#172033" stroke-width="2" fill="none">
    <circle cx="91" cy="485" r="15"/><path d="M91 500v55 M64 520h54 M91 555l-23 35 M91 555l23 35"/>
    <circle cx="91" cy="855" r="15"/><path d="M91 870v55 M64 890h54 M91 925l-23 35 M91 925l23 35"/>
  </g>
  <text x="91" y="620" text-anchor="middle" class="actorLabel">User</text>
  <text x="91" y="1000" text-anchor="middle" class="actorLabel">ESP32 / Sensor</text>
  <g stroke="#172033" stroke-width="2" fill="none"><circle cx="1640" cy="280" r="15"/><path d="M1640 295v55 M1613 315h54 M1640 350l-23 35 M1640 350l23 35"/></g>
  <text x="1640" y="425" text-anchor="middle" class="actorLabel">Admin</text>

  <!-- Actor associations to functional modules -->
  <g class="link">
    <path d="M117 520 L278 170"/><path d="M117 520 L278 310"/><path d="M117 520 L278 450"/><path d="M117 520 L278 625"/><path d="M117 520 L278 825"/>
    <path d="M117 890 L278 825"/>
  </g>

  <!-- Functional modules -->
  <ellipse cx="365" cy="170" rx="88" ry="29" class="group"/><text x="365" y="170" class="caseText" font-weight="700">Account Management</text>
  <ellipse cx="365" cy="310" rx="88" ry="29" class="group"/><text x="365" y="310" class="caseText" font-weight="700">Site Management</text>
  <ellipse cx="365" cy="450" rx="88" ry="29" class="group"/><text x="365" y="450" class="caseText" font-weight="700">Device Management</text>
  <ellipse cx="365" cy="625" rx="102" ry="34" class="group"/><text x="365" y="625" class="caseText" font-weight="700">Water Quality Monitoring</text>
  <ellipse cx="365" cy="825" rx="88" ry="34" class="group"/><text x="365" y="825" class="caseText" font-weight="700">Measurement Ingestion</text>

  <!-- Module to use case relationships -->
  <g class="include">
    <path d="M453 170 C500 170 500 145 555 145"/><path d="M453 170 C500 170 500 195 555 195"/>
    <path d="M453 310 C500 310 500 285 555 285"/><path d="M453 310 C500 310 500 335 555 335"/>
    <path d="M453 450 C500 450 500 425 555 425"/><path d="M453 450 C500 450 500 475 555 475"/>
    <path d="M467 625 C510 625 510 535 555 535"/><path d="M467 625 C510 625 510 585 555 585"/><path d="M467 625 C510 625 510 635 555 635"/><path d="M467 625 C510 625 510 685 555 685"/>
    <path d="M453 825 C500 825 500 795 555 795"/>
  </g>
  <text x="493" y="158" class="rel">&lt;&lt;include&gt;&gt;</text><text x="493" y="188" class="rel">&lt;&lt;include&gt;&gt;</text>
  <text x="493" y="298" class="rel">&lt;&lt;include&gt;&gt;</text><text x="493" y="328" class="rel">&lt;&lt;include&gt;&gt;</text>
  <text x="493" y="438" class="rel">&lt;&lt;include&gt;&gt;</text><text x="493" y="468" class="rel">&lt;&lt;include&gt;&gt;</text>
  <text x="493" y="555" class="rel">&lt;&lt;include&gt;&gt;</text><text x="493" y="578" class="rel">&lt;&lt;include&gt;&gt;</text><text x="493" y="635" class="rel">&lt;&lt;include&gt;&gt;</text><text x="493" y="674" class="rel">&lt;&lt;include&gt;&gt;</text>
  <text x="493" y="808" class="rel">&lt;&lt;include&gt;&gt;</text>

  <!-- Detailed use cases -->
  <ellipse cx="680" cy="145" rx="112" ry="24" class="case"/><text x="680" y="145" class="caseText">Register Account</text>
  <ellipse cx="680" cy="195" rx="112" ry="24" class="case"/><text x="680" y="195" class="caseText">Log In</text>
  <ellipse cx="680" cy="285" rx="112" ry="24" class="case"/><text x="680" y="285" class="caseText">Create Monitoring Site</text>
  <ellipse cx="680" cy="335" rx="112" ry="24" class="case"/><text x="680" y="335" class="caseText">View Monitoring Sites</text>
  <ellipse cx="680" cy="425" rx="112" ry="24" class="case"/><text x="680" y="425" class="caseText">Register Device</text>
  <ellipse cx="680" cy="475" rx="112" ry="24" class="case"/><text x="680" y="475" class="caseText">View Devices / Last Seen</text>
  <ellipse cx="680" cy="535" rx="112" ry="24" class="case"/><text x="680" y="535" class="caseText">View Latest Measurement</text>
  <ellipse cx="680" cy="585" rx="112" ry="24" class="case"/><text x="680" y="585" class="caseText">View Measurement History</text>
  <ellipse cx="680" cy="635" rx="112" ry="24" class="case"/><text x="680" y="635" class="caseText">View Daily Summary</text>
  <ellipse cx="680" cy="685" rx="112" ry="24" class="case"/><text x="680" y="685" class="caseText">View Screening Assessment</text>
  <ellipse cx="680" cy="795" rx="112" ry="24" class="case"/><text x="680" y="795" class="caseText">Submit Measurement via HTTP</text>

  <!-- Ingestion details included by submitting a measurement -->
  <path d="M792 795 C850 795 850 730 912 730" class="include"/><path d="M792 795 C850 795 850 780 912 780" class="include"/><path d="M792 795 C850 795 850 830 912 830" class="include"/>
  <text x="827" y="754" class="rel">&lt;&lt;include&gt;&gt;</text><text x="827" y="779" class="rel">&lt;&lt;include&gt;&gt;</text><text x="827" y="824" class="rel">&lt;&lt;include&gt;&gt;</text>
  <ellipse cx="1050" cy="730" rx="125" ry="24" class="case"/><text x="1050" y="730" class="caseText">Authenticate Device Token</text>
  <ellipse cx="1050" cy="780" rx="125" ry="24" class="case"/><text x="1050" y="780" class="caseText">Validate and Store Reading</text>
  <ellipse cx="1050" cy="830" rx="125" ry="24" class="case"/><text x="1050" y="830" class="caseText">Assess Reading Against Thresholds</text>

  <!-- Administrator account controls -->
  <g class="link"><path d="M1613 315 C1580 315 1570 220 1535 220"/><path d="M1613 315 C1580 315 1570 295 1535 295"/><path d="M1613 315 C1580 315 1570 370 1535 370"/></g>
  <ellipse cx="1420" cy="220" rx="115" ry="24" class="case"/><text x="1420" y="220" class="caseText">View User Accounts</text>
  <ellipse cx="1420" cy="295" rx="115" ry="24" class="case"/><text x="1420" y="295" class="caseText">Update Account Status</text>
  <ellipse cx="1420" cy="370" rx="115" ry="24" class="case"/><text x="1420" y="370" class="caseText">Change User Role</text>
  <!-- Sensor submits measurements -->
  <path d="M117 890 L558 795" class="link"/>
  <text x="270" y="830" class="rel" transform="rotate(-12 270 830)">sends sensor data</text>

  <text x="245" y="970" font-size="13" fill="#64748b">Daily summaries are calculated from stored measurements; insufficient sample counts are reported as insufficient data.</text>
</svg>
